# ============================================================
#  WhrBlog Docker Compose 编排
#  使用方式（二选一）：
#    方式 A（推荐）：cp .env.example .env && docker compose up -d
#    方式 B（零配置）：直接 docker compose up -d
#                    （未提供 .env 时使用下方内置开发默认值，无需任何配置文件）
#    之后：docker compose exec backend python manage.py createsuperuser
#  说明：未提供 .env 时，MySQL/Redis/ES 使用内置开发默认值
#        （DJANGO_MYSQL_PASSWORD=123456 / REDIS_PASSWORD=whr1452 / ES_PASSWORD=whr1452）
# ============================================================

services:

  # ----------------------------------------------------------
  #  Django 后端（Gunicorn）
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: whrblog-backend:latest
    container_name: whrblog-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_MYSQL_HOST: mysql
      DJANGO_MYSQL_PORT: "3306"
      DJANGO_MYSQL_USER: ${DJANGO_MYSQL_USER:-whr}
      DJANGO_MYSQL_PASSWORD: ${DJANGO_MYSQL_PASSWORD:-123456}
      DJANGO_MYSQL_DATABASE: ${DJANGO_MYSQL_DATABASE:-whrblog}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-whr1452}
      DJANGO_REDIS_URL: ":${REDIS_PASSWORD}@redis:6379/0"
      # ES 在容器内走 Docker 服务名（ES 为明文 HTTP，非 HTTPS；.env 同样用该服务名）
      ES_HOST: "http://elasticsearch:9200"
      # 无 .env 文件时的开发默认值（存在 .env 则被覆盖，详见 .env.example）
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only-not-for-prod-whrblog-9f8e7d6c5b4a3210}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*,127.0.0.1,localhost}
      ES_PASSWORD: ${ES_PASSWORD:-whr1452}
    volumes:
      - static_data:/app/collectedstatic
      - media_data:/app/uploads
      # 种子数据（首次部署自动灌入；详见 deploy/seed 与 loadseed 命令）
      - ./deploy/seed:/app/seed:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - whrblog-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------------------------------------------
  #  Celery Worker（异步任务：邮件发送、ES 同步）
  # ----------------------------------------------------------
  worker:
    image: whrblog-backend:latest
    container_name: whrblog-worker
    restart: unless-stopped
    entrypoint: ["celery", "-A", "whrblog", "worker", "-l", "info", "--concurrency=2"]
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_MYSQL_HOST: mysql
      DJANGO_MYSQL_PORT: "3306"
      DJANGO_MYSQL_USER: ${DJANGO_MYSQL_USER:-whr}
      DJANGO_MYSQL_PASSWORD: ${DJANGO_MYSQL_PASSWORD:-123456}
      DJANGO_MYSQL_DATABASE: ${DJANGO_MYSQL_DATABASE:-whrblog}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-whr1452}
      DJANGO_REDIS_URL: ":${REDIS_PASSWORD}@redis:6379/0"
      # ES 在容器内走 Docker 服务名（ES 为明文 HTTP，非 HTTPS；.env 同样用该服务名）
      ES_HOST: "http://elasticsearch:9200"
      # 无 .env 文件时的开发默认值（存在 .env 则被覆盖，详见 .env.example）
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only-not-for-prod-whrblog-9f8e7d6c5b4a3210}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*,127.0.0.1,localhost}
      ES_PASSWORD: ${ES_PASSWORD:-whr1452}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "whrblog", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - whrblog-net

  # ----------------------------------------------------------
  #  Vue 前端（Nginx 托管构建产物）
  # ----------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: whrblog-frontend
    restart: unless-stopped
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - whrblog-net

  # ----------------------------------------------------------
  #  Nginx 反向代理（统一入口，处理静态资源 / API 转发）
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: whrblog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - whrblog-net

  # ----------------------------------------------------------
  #  MySQL 8.0
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: whrblog-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DJANGO_MYSQL_DATABASE:-whrblog}
      MYSQL_USER: ${DJANGO_MYSQL_USER:-whr}
      MYSQL_PASSWORD: ${DJANGO_MYSQL_PASSWORD:-123456}
      MYSQL_ROOT_PASSWORD: ${DJANGO_MYSQL_PASSWORD:-123456}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - whrblog-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DJANGO_MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=200

  # ----------------------------------------------------------
  #  Redis 7
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: whrblog-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-whr1452} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - whrblog-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-whr1452}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------
  #  Elasticsearch 9（全文搜索，启用安全认证 + IK 中文分词）
  # ----------------------------------------------------------
  elasticsearch:
    build:
      context: .
      dockerfile: deploy/es/Dockerfile
    image: whrblog-es:9.4.3
    container_name: whrblog-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # ES 9.x 默认启用安全（TLS + 认证），用 ELASTIC_PASSWORD 设置 elastic 用户密码
      - ELASTIC_PASSWORD=${ES_PASSWORD:-whr1452}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - whrblog-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ES_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
  static_data:
    driver: local
  media_data:
    driver: local
  frontend_dist:
    driver: local
    driver: local
    driver: local

networks:
  whrblog-net:
    driver: bridge
