# ============================================================
#  WhrBlog Nginx 站点配置
#
#  架构：
#    浏览器 → Nginx(:80/:443)
#              ├─ /api/* /admin/* → backend:8000 (Gunicorn)
#              ├─ /static/* /media/*          → 本地文件（长期缓存）
#              └─ /*                          → frontend (Vue SPA)
#
#  SSL 配置说明：
#    初次部署先用 HTTP（certbot 验证），获取证书后取消 HTTPS server 注释
# ============================================================

# --- HTTP 服务器（始终启用，兼作 ACME 验证入口） ---
server {
    listen 80;
    # 开发可用 localhost；生产部署改为你的真实域名（如 whr.hopto.org），
    # 以便 Let's Encrypt 的 HTTP-01 挑战能正确匹配。
    server_name whr.hopto.org localhost;

    # Certbot ACME 验证（获取 SSL 证书时需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- API / Admin → Django 后端 ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django 静态文件（collectstatic 产物） ---
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- 用户上传文件 ---
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- 健康检查（Nginx 自身） ---
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Vue SPA 前端 ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # HTML 不缓存，确保更新及时
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }
    }
}

